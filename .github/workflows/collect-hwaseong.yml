name: 화성 수집 (5분마다)

on:
  schedule:
    - cron: "*/5 * * * *"        # GitHub 최소 간격. 붐비면 늦어지거나 건너뛸 수 있음
  workflow_dispatch:              # Actions 탭 "Run workflow" = 즉시 갱신
  push:
    branches: [main]
    paths: ["tennis/**", "scripts/**", ".github/workflows/collect-hwaseong.yml"]

permissions:
  contents: write

concurrency:
  group: collect-hwaseong
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 캐시 복원 (시설 좌표)
        uses: actions/cache@v4
        with:
          path: data/cache
          key: cache-hwaseong-${{ github.run_id }}
          restore-keys: cache-hwaseong-
      - name: 수집
        run: python -m tennis.collect --days 14 --only hwaseong --out data/snapshot_hwaseong.json
      - name: data 브랜치에 올리기
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_data.sh data/snapshot_hwaseong.json snapshot_hwaseong.json
