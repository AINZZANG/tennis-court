name: 화성 수집 (5분마다)

# 실행 하나가 약 5시간 40분 동안 머물며 5분마다 수집하고, 끝날 때 다음 실행을 스스로 시작한다.
# (GitHub 시간 예약은 늦거나 안 도는 경우가 많아서 보조로만 둔다)
on:
  schedule:
    - cron: "7 * * * *"           # 보조: 반복 실행이 멈췄을 때 다시 살리는 용도
  workflow_dispatch:              # Actions 탭 "Run workflow" = 지금 다시 시작
  push:
    branches: [main]
    paths: ["tennis/**", "scripts/**", ".github/workflows/collect-hwaseong.yml"]

permissions:
  contents: write
  actions: write                  # 끝날 때 다음 실행을 시작하기 위해

concurrency:
  group: collect-hwaseong
  cancel-in-progress: true        # 새 실행(코드 수정 등)이 오면 이전 반복을 멈추고 교체

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 캐시 복원 (시설 좌표)
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: cache-hwaseong-${{ github.run_id }}
          restore-keys: cache-hwaseong-
      - name: 5분마다 수집해서 data 브랜치에 올리기
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          bash scripts/run_loop.sh 300 20400
          "python -m tennis.collect --days 14 --only hwaseong --out data/snapshot_hwaseong.json
          && bash scripts/publish_data.sh data/snapshot_hwaseong.json snapshot_hwaseong.json"
      - name: 캐시 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: cache-hwaseong-${{ github.run_id }}
      - name: 다음 실행 시작
        if: success()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sf -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/collect-hwaseong.yml/dispatches" \
            -d '{"ref":"main"}' && echo "다음 실행 요청 완료"
