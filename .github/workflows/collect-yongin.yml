name: 용인 수집 (20분마다)

# 실행 하나가 약 5시간 40분 동안 머물며 20분마다 수집하고, 끝날 때 다음 실행을 스스로 시작한다.
# (GitHub 시간 예약은 늦거나 안 도는 경우가 많아서 보조로만 둔다)
on:
  schedule:
    - cron: "37 * * * *"          # 보조: 반복 실행이 멈췄을 때 다시 살리는 용도
  workflow_dispatch:              # Actions 탭 "Run workflow" = 지금 다시 시작
  push:                           # 화면(index.html)을 고쳐 올리면 이 워크플로가 사이트에 배포
    branches: [main]
    paths: ["tennis/**", "scripts/**", "web/index.html", ".github/workflows/collect-yongin.yml"]

permissions:
  contents: write
  actions: write                  # 끝날 때 다음 실행을 시작하기 위해

concurrency:
  group: collect-yongin           # 겹쳐 실행하지 않음 (용인 차단 방지)
  cancel-in-progress: true        # 새 실행(코드 수정 등)이 오면 이전 반복을 멈추고 교체

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 캐시 복원 (용인 시간표·목록)
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: cache-yongin-${{ github.run_id }}
          restore-keys: |
            cache-yongin-
            collect-cache-
      - name: 20분마다 수집해서 data 브랜치와 사이트에 올리기
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YONGIN_INTERVAL: "1.5"        # 요청 간격(초)
          YONGIN_SLOT_BUDGET: "700"     # 한 번에 보낼 수 있는 상한
          YONGIN_TTL_NEAR_MIN: "18"     # 내일~3일 후·주말: 20분마다
          YONGIN_TTL_FAR_MIN: "50"      # 그 외: 1시간마다 (꽉 찬 4일 이후는 3시간)
        run: >
          bash scripts/run_loop.sh 1200 20400
          "python -m tennis.collect --days 14 --only yongin --out data/snapshot_yongin.json
          && bash scripts/publish_data.sh data/snapshot_yongin.json snapshot_yongin.json --pages"
      - name: 캐시 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: cache-yongin-${{ github.run_id }}
      - name: 다음 실행 시작
        if: success()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sf -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/collect-yongin.yml/dispatches" \
            -d '{"ref":"main"}' && echo "다음 실행 요청 완료"
