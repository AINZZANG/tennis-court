name: 용인 수집 (20분마다)

on:
  schedule:
    - cron: "2,22,42 * * * *"    # 붐비면 늦어지거나 건너뛸 수 있음
  workflow_dispatch:              # Actions 탭 "Run workflow" = 즉시 갱신 (차단 의심으로 쉬는 중이면 시간표는 캐시 값 사용)
  push:                           # 화면(index.html)을 고쳐 올리면 이 워크플로가 사이트에 배포
    branches: [main]
    paths: ["tennis/**", "scripts/**", "web/index.html", ".github/workflows/collect-yongin.yml"]

permissions:
  contents: write

concurrency:
  group: collect-yongin           # 겹쳐 실행하지 않음 (용인 차단 방지)
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 캐시 복원 (용인 시간표·목록)
        uses: actions/cache@v4
        with:
          path: data/cache
          key: cache-yongin-${{ github.run_id }}
          restore-keys: |
            cache-yongin-
            collect-cache-
      - name: 수집
        env:
          YONGIN_INTERVAL: "1.5"        # 요청 간격(초)
          YONGIN_SLOT_BUDGET: "700"     # 한 번에 보낼 수 있는 상한
          YONGIN_TTL_NEAR_MIN: "18"     # 내일~3일 후·주말: 20분마다
          YONGIN_TTL_FAR_MIN: "50"      # 그 외: 1시간마다 (꽉 찬 4일 이후는 3시간)
        run: python -m tennis.collect --days 14 --only yongin --out data/snapshot_yongin.json
      - name: data 브랜치와 사이트에 올리기
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_data.sh data/snapshot_yongin.json snapshot_yongin.json --pages
